[package]
name = "sad-pet-plugin"
version = "0.14.0"
edition = "2024"
publish = false
description = "Host-driven SAD PET engine for VST3 and Audio Unit wrappers"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sad-pet = { path = "../rust", default-features = false, features = ["source-worker"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rtrb = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
