name: Build and deploy WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
      - name: Install Rust with the WebAssembly target
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.97.0
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy -p sad-pet-wasm --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test -p sad-pet-wasm --lib --locked
          cargo test -p sad-pet --no-default-features --lib dsp::limiter --locked
          cargo test -p sad-pet --no-default-features --lib dsp::tb303 --locked
          cargo test -p sad-pet --no-default-features --lib dsp::synth --locked
          cargo test -p sad-pet --no-default-features --lib dsp::sequence --locked
          cargo test -p sad-pet --no-default-features --lib dsp::main_pitch_tests --locked
          cargo test -p sad-pet --no-default-features --test neuropolis --locked
          cargo test -p sad-pet --no-default-features --lib audio_import --locked
          cargo test -p sad-pet --no-default-features --lib wavetable --locked
          cargo test -p sad-pet --no-default-features --test wavetable --locked
          cargo test -p sad-pet --no-default-features --test bus --test grain_continuity --test sequence_sources_reuse --locked
          cargo test -p sad-pet --no-default-features --test rack_instruments --test rack --test rack_sources --locked
          cargo test -p sad-pet --no-default-features --lib interaction --locked
          cargo test -p sad-pet --no-default-features --lib grain_group_tests --locked
          cargo test -p sad-pet --no-default-features --lib waveshaper --locked
          cargo test -p sad-pet --no-default-features --lib dsp::filter::delay_tests --locked
          cargo test -p sad-pet --no-default-features --test waveshaper_quality --test waveshaper_filters --test source_fx_waveshaper_latency --locked
          cargo test -p sad-pet --no-default-features --test oscillator_engine --locked
          cargo test -p sad-pet-alphaverb --release --lib --locked
          cargo test -p sad-pet-superecho --release --lib --locked
          cargo test -p sad-pet-voice --release --locked
          cargo clippy -p sad-pet-voice --all-targets --features cli --locked -- -D warnings
      - name: Build the standalone site
        run: python3 wasm/build.py --simd
      - name: Exercise the compiled audio engine
        run: |
          node wasm/test.mjs
          node wasm/test-realtime.mjs
          node wasm/test-render.mjs
          node wasm/test-telemetry.mjs
          node wasm/test-loader.mjs
          node wasm/test-tailcall.mjs
          node wasm/test-simd.mjs
          node wasm/test-grain-quality.mjs
          node wasm/test-resynth.mjs
          node wasm/test-filters.mjs
          node wasm/test-imported.mjs
          node wasm/test-imported-ui.mjs
          node wasm/test-filters-ui.mjs
          node wasm/test-waveshaper.mjs
          node wasm/test-waveshaper-ui.mjs
          node wasm/test-neuropolis.mjs
          node wasm/test-polyphony.mjs
          node wasm/test-source-fx-modulation.mjs
          node wasm/test-timbres.mjs
          node wasm/test-tempo.mjs
          node wasm/test-buses.mjs
          node wasm/test-master.mjs
          node wasm/test-tb303.mjs
          node wasm/test-bus-ui.mjs
          node wasm/test-mixer-ui.mjs
          node wasm/test-taps-ui.mjs
          node wasm/test-rack.mjs
          node wasm/test-wavetable.mjs
          node wasm/test-oscillators.mjs
          node wasm/test-oscillators.mjs dist/web sad_pet.simd.wasm
          node wasm/test-control.mjs
          node wasm/test-wavetable-memory.mjs
          node wasm/test-wavetable-cache.mjs
          node wasm/test-thirdwave.mjs
          node wasm/test-wavetable-parity.mjs
          node wasm/test-wavetable-parity.mjs dist/web /tmp/thirdwave-parity.json thirdwave
          node wasm/test-wavetable-parity.mjs dist/web /tmp/unison4-parity.json unison4
          node wasm/test-eq.mjs
          node wasm/test-grain-groups-ui.mjs
          node wasm/test-synth.mjs
          node wasm/test-sequencer-ui.mjs
          node wasm/test-microphone.mjs
          node wasm/test-library.mjs
          node wasm/test-audio-import.mjs
          node wasm/test-presets.mjs
          node wasm/test-startup.mjs
          node wasm/test-controls-ui.mjs
          node wasm/test-midi-learn-ui.mjs
          node wasm/test-midi-targets.mjs
          node wasm/test-launch-control.mjs
          node wasm/test-xl3-feedback.mjs
          node wasm/test-xl3-sequencer.mjs
          node wasm/test-midi-clock.mjs
          node wasm/test-clock-ui.mjs
          node wasm/test-modulation-ui.mjs
          node wasm/test-lfo-ui.mjs
          node wasm/test-effect-presets.mjs
          node wasm/test-instrument-presets.mjs
          node wasm/test-instruments.mjs
          node wasm/test-parameters.mjs
          node wasm/test-vocal.mjs
          node wasm/test-vocal-ui.mjs
          node wasm/test-sampler.mjs
          node rust/scripts/check_sampler_packs.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
