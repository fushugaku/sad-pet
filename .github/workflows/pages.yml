name: Build and deploy WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy -p sad-pet-wasm --target wasm32-unknown-unknown --locked -- -D warnings
          cargo test -p sad-pet-wasm --lib --locked
      - name: Build the standalone site
        run: python3 wasm/build.py
      - name: Exercise the compiled audio engine
        run: |
          node wasm/test.mjs
          node wasm/test-realtime.mjs
          node wasm/test-resynth.mjs
          node wasm/test-filters.mjs
          node wasm/test-imported.mjs
          node wasm/test-imported-ui.mjs
          node wasm/test-filters-ui.mjs
          node wasm/test-neuropolis.mjs
          node wasm/test-sequencer-ui.mjs
          node wasm/test-microphone.mjs
          node wasm/test-library.mjs
          node wasm/test-presets.mjs
          node wasm/test-parameters.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
