name: Build DAW plug-ins

on:
  push:
    branches: [main, 'codex/daw-plugins']
    paths: ['plugin/**', 'rust/**', 'Cargo.toml', 'Cargo.lock', 'wasm/test-presets.mjs', '.github/workflows/plugins.yml']
  pull_request:
    paths: ['plugin/**', 'rust/**', 'Cargo.toml', 'Cargo.lock', 'wasm/test-presets.mjs', '.github/workflows/plugins.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-universal
            runner: macos-latest
            arguments: --universal
          - platform: Windows-x64
            runner: windows-latest
            arguments: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check plugin engine
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy -p sad-pet-plugin --no-default-features --all-targets --locked -- -D warnings
          cargo test -p sad-pet-plugin --no-default-features --locked
          node wasm/test-presets.mjs
      - name: Build, test and package
        run: python plugin/scripts/build.py ${{ matrix.arguments }}
      - name: Validate macOS installer and Audio Units
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -x
          installer -pkg dist/plugins/SAD-PET-Plugins-macOS-universal.pkg -dominfo
          installer -pkg dist/plugins/SAD-PET-Plugins-macOS-universal.pkg -target CurrentUserHomeDirectory
          # Same-version reinstall must replace a bundle rather than merge stale files.
          for plugin in "$HOME/Library/Audio/Plug-Ins/Components/SAD PET"*.component "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET"*.vst3; do
            touch "$plugin/stale-installer-test"
          done
          mkdir -p "$HOME/Library/Application Support/SAD PET/Presets"
          echo 'Preserve user data' > "$HOME/Library/Application Support/SAD PET/Presets/installer-test.txt"
          installer -pkg dist/plugins/SAD-PET-Plugins-macOS-universal.pkg -target CurrentUserHomeDirectory
          for plugin in "$HOME/Library/Audio/Plug-Ins/Components/SAD PET"*.component "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET"*.vst3; do
            test ! -e "$plugin/stale-installer-test"
          done
          test "$(cat "$HOME/Library/Application Support/SAD PET/Presets/installer-test.txt")" = 'Preserve user data'
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/Components/SAD PET.component"
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/Components/SAD PET FX.component"
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET.vst3"
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET FX.vst3"
          auval -a > /tmp/sad-pet-au-list.log 2>&1
          auval -v aumu SaPi SdPt
          auval -v aumf SaPf SdPt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SAD-PET-Plugins-${{ matrix.platform }}
          path: |
            dist/plugins/*.zip
            dist/plugins/*.pkg
            dist/plugins/*.sha256
          if-no-files-found: error
