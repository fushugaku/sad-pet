name: Build DAW plug-ins

on:
  push:
    branches: [main, 'codex/daw-plugins']
    tags: ['plugins-v*']
    paths: ['plugin/**', 'rust/**', 'Cargo.toml', 'Cargo.lock', 'wasm/test-presets.mjs', 'wasm/test-parameters.mjs', '.github/workflows/plugins.yml']
  pull_request:
    paths: ['plugin/**', 'rust/**', 'Cargo.toml', 'Cargo.lock', 'wasm/test-presets.mjs', 'wasm/test-parameters.mjs', '.github/workflows/plugins.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/plugins-v') }}
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-universal
            runner: macos-latest
            arguments: --universal
          - platform: Windows-x64
            runner: windows-latest
            arguments: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Check plugin engine
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy -p sad-pet-plugin --no-default-features --all-targets --locked -- -D warnings
          cargo test -p sad-pet-plugin --no-default-features --locked
          cargo test -p sad-pet --no-default-features --test parameter_updates --locked
          node wasm/test-presets.mjs
          node wasm/test-parameters.mjs
          python -m unittest discover -s plugin/scripts -p 'test_*.py'
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/plugins-v')
        shell: bash
        run: python plugin/scripts/publish_release.py "$GITHUB_REF_NAME" --check-tag
      - name: Reuse validated native binaries for installer-only edits
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python plugin/scripts/reuse_native.py ${{ matrix.platform }}
      - name: Build, test and package
        run: python plugin/scripts/build.py ${{ matrix.arguments }} ${{ steps.native.outputs.arguments }}
      - name: Validate macOS installer and Audio Units
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -x
          installer -pkg dist/plugins/SAD-PET-Plugins-macOS-universal.pkg -dominfo
          installer -pkg dist/plugins/SAD-PET-Plugins-macOS-universal.pkg -target CurrentUserHomeDirectory
          # Same-version reinstall must replace a bundle rather than merge stale files.
          for plugin in "$HOME/Library/Audio/Plug-Ins/Components/SAD PET"*.component "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET"*.vst3; do
            touch "$plugin/stale-installer-test"
          done
          mkdir -p "$HOME/Library/Application Support/SAD PET/Presets"
          echo 'Preserve user data' > "$HOME/Library/Application Support/SAD PET/Presets/installer-test.txt"
          installer -pkg dist/plugins/SAD-PET-Plugins-macOS-universal.pkg -target CurrentUserHomeDirectory
          for plugin in "$HOME/Library/Audio/Plug-Ins/Components/SAD PET"*.component "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET"*.vst3; do
            test ! -e "$plugin/stale-installer-test"
          done
          test "$(cat "$HOME/Library/Application Support/SAD PET/Presets/installer-test.txt")" = 'Preserve user data'
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/Components/SAD PET.component"
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/Components/SAD PET FX.component"
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET.vst3"
          codesign --verify --deep --strict "$HOME/Library/Audio/Plug-Ins/VST3/SAD PET FX.vst3"
          python3 plugin/scripts/validate_audio_units.py
      - name: Validate Windows installer and uninstaller
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./plugin/scripts/validate_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SAD-PET-Plugins-${{ matrix.platform }}
          path: |
            dist/plugins/*.zip
            dist/plugins/*.pkg
            dist/plugins/*.exe
            dist/plugins/*.sha256
          if-no-files-found: error

  release:
    name: Publish installers
    if: ${{ always() && startsWith(github.ref, 'refs/tags/plugins-v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download tested packages
        run: |
          python3 plugin/scripts/publish_release.py "$GITHUB_REF_NAME" --check-tag
          tested_run=$(gh run list --workflow plugins.yml --commit "$GITHUB_SHA" --event push --status success --limit 20 --json databaseId,headBranch --jq '[.[] | select(.headBranch == "main" or .headBranch == "codex/daw-plugins")][0].databaseId // empty')
          if [ -z "$tested_run" ]; then
            echo 'Build and validate this exact commit on main before tagging a release.'
            exit 1
          fi
          gh run download "$tested_run" --pattern 'SAD-PET-Plugins-*' --dir dist/release
      - name: Verify packages and publish release
        run: python3 plugin/scripts/publish_release.py "$GITHUB_REF_NAME"
