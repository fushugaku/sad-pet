[package]
name = "sad-pet-wasm"
version = "0.28.1"
edition = "2024"
description = "SAD PET WebAssembly audio engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sad-pet = { path = "../rust", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
