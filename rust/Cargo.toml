[package]
name = "sad-pet"
version = "0.20.1"
edition = "2024"
description = "SAD PET desktop granular instrument"
publish = false

[lib]
name = "sad_pet"

[[bin]]
name = "sad-pet"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:cpal", "dep:ctrlc", "dep:midir", "dep:mp3lame-encoder", "dep:rtrb", "dep:tiny_http"]

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.16", optional = true }
ctrlc = { version = "3.4", optional = true }
midir = { version = "0.10", optional = true }
mp3lame-encoder = { version = "0.2.5", optional = true }
rtrb = { version = "0.3", optional = true }
tiny_http = { version = "0.12", optional = true }
