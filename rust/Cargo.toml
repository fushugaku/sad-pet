[package]
name = "sad-pet"
version = "0.14.0"
edition = "2024"
description = "SAD PET desktop granular instrument"
publish = false

[lib]
name = "sad_pet"

[[bin]]
name = "sad-pet"
path = "src/main.rs"

[dependencies]
hound = "3.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.16"
ctrlc = "3.4"
midir = "0.10"
mp3lame-encoder = "0.2.5"
rtrb = "0.3"
tiny_http = "0.12"
