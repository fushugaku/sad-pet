[package]
name = "sad-pet"
version = "0.34.2"
edition = "2024"
description = "SAD PET desktop granular instrument"
publish = false

[lib]
name = "sad_pet"

[[bin]]
name = "sad-pet"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
source-worker = ["dep:rtrb"]
desktop = ["source-worker", "dep:cpal", "dep:ctrlc", "dep:midir", "dep:mp3lame-encoder", "dep:rtrb", "dep:tiny_http"]

[dependencies]
sad-pet-superecho = { path = "../vendor/superecho" }
sad-pet-alphaverb = { path = "../vendor/alphaverb" }
sad-pet-dxm088 = { path = "../vendor/dxm088" }
sad-pet-mooz = { path = "../vendor/mooz" }
sad-pet-voice = { path = "../voice" }
hound = "3.5"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
radias-synth-domain = { git = "https://github.com/fushugaku/Rustias.git", rev = "91cae3f57a868a80d32a2e6ebb113938efd65025" }
radias-synth-application = { git = "https://github.com/fushugaku/Rustias.git", rev = "91cae3f57a868a80d32a2e6ebb113938efd65025" }
metropolix-core = { git = "https://github.com/fushugaku/neuropolis.git", rev = "872a28c70de0cc6264dfab84aad8b78a2f224395" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.16", optional = true }
ctrlc = { version = "3.4", optional = true }
midir = { version = "0.10", optional = true }
mp3lame-encoder = { version = "0.2.5", optional = true }
rtrb = { version = "0.3", optional = true }
tiny_http = { version = "0.12", optional = true }
